name: Feature Request
description: Suggest a new feature for nimkit
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe what you'd like.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
      placeholder: |
        I often need to...
        Currently I have to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What's your proposed solution?
      description: How you think this should work.
      placeholder: |
        `nimkit <command>` should...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.

  - type: textarea
    id: scope
    attributes:
      label: Does this fit nimkit's scope?
      description: |
        nimkit focuses on **local dev lifecycle** (build, test, run, manage).
        It does **not** handle publishing, registry, or package distribution.
        Does your feature fit within this scope?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else (examples from other tools, screenshots, etc.)
