name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'

      - name: Build
        run: nim c --path:src -o:nimkit src/nimkit.nim

      - name: Verify binary
        run: ./nimkit help

      - name: Smoke test — create and build
        run: |
          ./nimkit new testproj
          cd testproj
          ../nimkit build
          ../nimkit test
          ../nimkit check --all
          ../nimkit clean
        shell: bash

      - name: Smoke test — add/remove deps
        run: |
          cd testproj
          ../nimkit add jsony
          ../nimkit deps
          ../nimkit remove jsony
        shell: bash

      - name: Smoke test — task command
        run: |
          cd testproj
          cat >> testproj.nimble << 'EOF'

          task greet, "Say hello":
            echo "Hello from task!"
          EOF
          ../nimkit task
          ../nimkit task greet
        shell: bash

      - name: Cleanup
        run: rm -rf testproj
        shell: bash
