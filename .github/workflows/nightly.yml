name: Nightly Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write         # Needed to push tags and create releases

env:
  TAG_NAME: nightly

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: nimkit-linux-amd64
            nim-arch: amd64
          - os: windows-latest
            artifact: nimkit-windows-amd64.exe
            nim-arch: amd64
          - os: macos-latest
            artifact: nimkit-macos-arm64
            nim-arch: arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Nim
        run: nim --version

      - name: Build
        run: nim c --path:src -o:${{ matrix.artifact }} src/nimkit.nim

      - name: Verify binary runs
        run: ./${{ matrix.artifact }} help
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for tag operations

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Move binaries into place
        run: |
          mkdir -p release/
          cp artifacts/nimkit-linux-amd64/nimkit-linux-amd64 release/
          cp artifacts/nimkit-windows-amd64.exe/nimkit-windows-amd64.exe release/
          cp artifacts/nimkit-macos-arm64/nimkit-macos-arm64 release/
          chmod +x release/nimkit-linux-amd64 release/nimkit-macos-arm64

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Delete existing nightly tag
        run: |
          git tag -d ${{ env.TAG_NAME }} 2>/dev/null || true
          git push origin :refs/tags/${{ env.TAG_NAME }} 2>/dev/null || true

      - name: Create and push nightly tag
        run: |
          git tag -a ${{ env.TAG_NAME }} \
            -m "Nightly build ${{ steps.commit.outputs.date }} (${{ steps.commit.outputs.sha }})"
          git push origin ${{ env.TAG_NAME }}

      - name: Delete existing nightly release
        run: gh release delete ${{ env.TAG_NAME }} --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        run: |
          gh release create ${{ env.TAG_NAME }} \
            --title "Nightly ${{ steps.commit.outputs.date }} (${{ steps.commit.outputs.sha }})" \
            --notes "Automated nightly build from \`master\` at ${{ steps.commit.outputs.sha }}." \
            --prerelease \
            release/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
